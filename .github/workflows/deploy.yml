name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expense-tracker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run check && npm test
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over verified SSH
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          private_dir=$(mktemp -d)
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$private_dir/known_hosts"
          printf '%s\n' "$ENV_FILE" > "$private_dir/.env"
          if ! ssh-keygen -lf "$private_dir/known_hosts" -E sha256 > "$private_dir/fingerprints" 2>/dev/null; then
            echo "SSH_KNOWN_HOSTS must contain complete known_hosts lines: host key-type public-key."
            exit 1
          fi
          echo "Saved SSH host-key fingerprints (public information):"
          awk '{print $1, $2, $NF}' "$private_dir/fingerprints"
          lookup_host="$SSH_HOST"
          if [[ "$port" != 22 ]]; then lookup_host="[$SSH_HOST]:$port"; fi
          if ! ssh-keygen -F "$lookup_host" -f "$private_dir/known_hosts" >/dev/null; then
            echo "SSH_KNOWN_HOSTS has no entry matching SSH_HOST and SSH_PORT."
            exit 1
          fi
          ssh_args=(-i "$private_dir/key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts")
          stage="$DEPLOY_PATH/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$stage'"
          tar -czf "$private_dir/release.tgz" src scripts package.json package-lock.json ecosystem.config.json
          scp -i "$private_dir/key" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts" "$private_dir/release.tgz" "$private_dir/.env" "$SSH_USER@$SSH_HOST:$stage/"
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "set -eu; trap 'rm -rf $stage' EXIT; cd '$stage'; tar -xzf release.tgz; bash scripts/deploy.sh '$stage' '$DEPLOY_PATH'"
